<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Turbine / Oceanic Vault Icon -->
  <g transform="translate(10, 10)">
    <circle cx="20" cy="20" r="18" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.4" fill="#0D1B4B" />
    <circle cx="20" cy="20" r="14" stroke="#00E5FF" stroke-dasharray="4 2" stroke-width="1.5" />
    <!-- 3 rotating hydro turbine blades -->
    <path d="M20 20 C20 12, 28 8, 30 12 C32 16, 26 20, 20 20 Z" fill="url(#cyanGlow)" filter="url(#glow)" />
    <path d="M20 20 C13 24, 9 32, 13 34 C17 36, 21 30, 20 20 Z" fill="url(#cyanGlow)" />
    <path d="M20 20 C27 26, 23 35, 19 33 C15 31, 17 23, 20 20 Z" fill="url(#goldGlow)" />
    <circle cx="20" cy="20" r="4" fill="#E8F4FD" stroke="#0A0F2C" stroke-width="1.5"/>
  </g>
  <!-- Brand Wordmark -->
  <text x="62" y="32" font-family="'Orbitron', sans-serif" font-size="20" font-weight="800" fill="#E8F4FD" letter-spacing="2">AQUA<tspan fill="#00E5FF">VAULT</tspan></text>
  <text x="63" y="44" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#8DB4CC" letter-spacing="3.5">HYDRO-ENERGY TELEMETRY</text>
</svg>